name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Refuse to release without the updater public key
        shell: bash
        run: |
          if grep -q SET_IN_RELEASE_SETUP desktop/tauri.conf.json; then
            echo "::error::desktop/tauri.conf.json still has the placeholder updater pubkey; installs from this release could never update."
            exit 1
          fi

      - run: npm test
      - run: npm run build:extension

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: cargo test --manifest-path desktop/Cargo.toml

      # Tauri downloads its NSIS tools with no retry and GitHub keeps answering 504, so they are put
      # where Tauri looks for them first.
      # shortcut: versions match @tauri-apps/cli 2.12.4; after an upgrade Tauri fetches its own again.
      - name: Download the installer tools
        shell: bash
        run: |
          fetch() { curl -fsSL --retry 30 --retry-all-errors --retry-delay 20 -o "$2" "$1"; }
          tools="$LOCALAPPDATA/tauri"
          mkdir -p "$tools"
          fetch https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip "$RUNNER_TEMP/nsis.zip"
          unzip -q "$RUNNER_TEMP/nsis.zip" -d "$tools"
          mv "$tools/nsis-3.13" "$tools/NSIS"
          mkdir -p "$tools/NSIS/Plugins/x86-unicode/additional"
          fetch https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll "$tools/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Boost Focus Timer ${{ github.ref_name }}
          releaseBody: See the README for install and update steps.
          releaseDraft: false
          includeUpdaterJson: true
          tauriScript: npx tauri

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:extension
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
